<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 230" role="img" aria-labelledby="title desc">
  <title id="title">Engineering profile terminal</title><desc id="desc">A compact terminal showing Mohamed Amine Ajana's engineering focus.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#091423"/><stop offset="1" stop-color="#0b1020"/></linearGradient><style>.cursor{animation:blink 1.1s steps(2,end) infinite}.dot{animation:breathe 3.2s ease-in-out infinite;transform-origin:center}@keyframes blink{50%{opacity:0}}@keyframes breathe{50%{opacity:.35;transform:scale(1.35)}}@media (prefers-reduced-motion:reduce){.cursor,.dot{animation:none}}</style></defs>
  <rect width="1080" height="230" rx="16" fill="url(#bg)" stroke="#1e3a5f"/><path d="M0 54h1080" stroke="#1e3a5f"/><circle class="dot" cx="30" cy="27" r="5" fill="#22d3ee"/><circle cx="48" cy="27" r="5" fill="#475569"/><circle cx="66" cy="27" r="5" fill="#475569"/><text x="94" y="32" fill="#94a3b8" font-family="Consolas,'Courier New',monospace" font-size="14">profile@control-plane:~</text>
  <g font-family="Consolas,'Courier New',monospace" font-size="16"><text x="34" y="91" fill="#67e8f9">$ whoami</text><text x="182" y="91" fill="#e2e8f0">Mohamed Amine Ajana — IT &amp; cloud systems engineer</text><text x="34" y="132" fill="#67e8f9">$ focus</text><text x="182" y="132" fill="#cbd5e1">reproducible delivery · containers · Kubernetes · observability</text><text x="34" y="173" fill="#67e8f9">$ approach</text><text x="182" y="173" fill="#cbd5e1">automate → validate → observe → improve</text><rect class="cursor" x="646" y="158" width="10" height="20" fill="#22d3ee"/></g>
</svg>
