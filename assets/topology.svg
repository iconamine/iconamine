<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 230" role="img" aria-labelledby="title desc">
  <title id="title">Continuous delivery and observability topology</title><desc id="desc">A subtle animated illustration of a delivery flow through build, package, deliver and observe stages.</desc>
  <defs><style>.flow{stroke-dasharray:8 12;animation:flow 11s linear infinite}.halo{transform-origin:center;animation:pulse 3.6s ease-in-out infinite}.halo2{transform-origin:center;animation:pulse 3.6s 1.1s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-160}}@keyframes pulse{50%{opacity:.14;transform:scale(1.25)}}@media (prefers-reduced-motion:reduce){.flow,.halo,.halo2{animation:none}}</style></defs>
  <rect width="1080" height="230" rx="16" fill="#0b1020" stroke="#1e3a5f"/><path class="flow" d="M185 116H365C430 116 420 66 500 66h70c80 0 64 100 145 100h180" fill="none" stroke="#38bdf8" stroke-width="2"/><path class="flow" d="M185 116H365C430 116 420 166 500 166h70c80 0 64-50 145-50h180" fill="none" stroke="#8b5cf6" stroke-opacity=".7" stroke-width="1.5"/>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g transform="translate(185 116)"><circle class="halo" r="37" fill="#0e7490" fill-opacity=".18"/><circle r="23" fill="#102238" stroke="#22d3ee"/><path d="M-8-6h16M-8 1h11M-8 8h14" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round"/><text y="58" fill="#cbd5e1" font-size="13" font-weight="700">BUILD</text><text y="78" fill="#64748b" font-size="11">tested code</text></g><g transform="translate(500 66)"><circle class="halo2" r="37" fill="#1d4ed8" fill-opacity=".16"/><circle r="23" fill="#102238" stroke="#60a5fa"/><path d="M-11 8l11-17 11 17z" fill="none" stroke="#bae6fd" stroke-width="2"/><text y="58" fill="#cbd5e1" font-size="13" font-weight="700">PACKAGE</text><text y="78" fill="#64748b" font-size="11">containers</text></g><g transform="translate(500 166)"><circle class="halo" r="37" fill="#312e81" fill-opacity=".19"/><circle r="23" fill="#102238" stroke="#a78bfa"/><path d="M-10 4l8-8 6 5 10-11M8-10h8v8" fill="none" stroke="#ddd6fe" stroke-width="2" stroke-linecap="round"/><text y="58" fill="#cbd5e1" font-size="13" font-weight="700">DELIVER</text><text y="78" fill="#64748b" font-size="11">KUBERNETES</text></g><g transform="translate(895 116)"><circle class="halo2" r="37" fill="#0e7490" fill-opacity=".18"/><circle r="23" fill="#102238" stroke="#22d3ee"/><path d="M-10 9V0m7 9V-10m7 19V-3" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round"/><text y="58" fill="#cbd5e1" font-size="13" font-weight="700">OBSERVE</text><text y="78" fill="#64748b" font-size="11">metrics &amp; health</text></g></g>
</svg>
