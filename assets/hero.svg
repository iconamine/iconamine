<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Amine Ajana — cloud-native systems and platform engineering</title>
  <desc id="desc">A dark cloud infrastructure control-plane illustration with subtly animated topology lines, data packets, a terminal cursor and system status indicators.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="0.55" stop-color="#0b1325"/><stop offset="1" stop-color="#090d19"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <radialGradient id="glow" cx="78%" cy="52%" r="55%"><stop stop-color="#1d4ed8" stop-opacity=".20"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M 44 0 L 0 0 0 44" fill="none" stroke="#7dd3fc" stroke-opacity=".075" stroke-width="1"/></pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .grid{animation:grid-drift 32s linear infinite}.scan{animation:scan 10s ease-in-out infinite}.route{stroke-dasharray:10 12;animation:flow 12s linear infinite}.route-slow{stroke-dasharray:5 18;animation:flow 18s linear infinite reverse}.pulse{transform-origin:center;animation:pulse 3.8s ease-in-out infinite}.pulse-late{transform-origin:center;animation:pulse 3.8s 1.3s ease-in-out infinite}.blink{animation:blink 1.1s steps(2,end) infinite}.packet{filter:url(#soft-glow)}.packet-a{animation:packet-a 9s ease-in-out infinite}.packet-b{animation:packet-b 12s ease-in-out 1.5s infinite}.packet-c{animation:packet-c 10s ease-in-out .8s infinite}
      @keyframes grid-drift{to{transform:translate(44px,44px)}}@keyframes scan{0%,100%{transform:translateY(-90px);opacity:0}35%,65%{opacity:.75}50%{transform:translateY(450px);opacity:.75}}@keyframes flow{to{stroke-dashoffset:-220}}@keyframes pulse{0%,100%{transform:scale(1);opacity:.65}50%{transform:scale(1.38);opacity:.12}}@keyframes blink{50%{opacity:0}}@keyframes packet-a{0%,100%{transform:translate(0,0);opacity:0}8%,82%{opacity:1}44%{transform:translate(235px,-76px)}72%{transform:translate(450px,-45px)}}@keyframes packet-b{0%,100%{transform:translate(0,0);opacity:0}10%,80%{opacity:1}48%{transform:translate(-130px,74px)}72%{transform:translate(-280px,26px)}}@keyframes packet-c{0%,100%{transform:translate(0,0);opacity:0}12%,82%{opacity:1}50%{transform:translate(-164px,-84px)}76%{transform:translate(-304px,-35px)}}@media (prefers-reduced-motion:reduce){.grid,.scan,.route,.route-slow,.pulse,.pulse-late,.blink,.packet-a,.packet-b,.packet-c{animation:none!important}}
    </style>
  </defs>
  <rect width="1440" height="560" rx="22" fill="url(#background)"/><rect width="1440" height="560" rx="22" fill="url(#glow)"/>
  <g class="grid"><rect width="1440" height="560" fill="url(#grid)"/></g><rect class="scan" x="720" width="720" height="2" fill="url(#cyan)" opacity=".3"/>
  <path d="M0 445 C260 385 370 510 624 442 S1010 280 1440 356" fill="none" stroke="#38bdf8" stroke-opacity=".13" stroke-width="1"/>
  <g fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif"><text x="74" y="86" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="3">PROFILE / CONTROL PLANE</text><rect x="74" y="107" width="68" height="2" fill="url(#cyan)"/><text x="74" y="187" font-size="52" font-weight="700" letter-spacing="-.8">MOHAMED AMINE</text><text x="74" y="245" font-size="52" font-weight="700" letter-spacing="-.8">AJANA</text><text x="74" y="294" fill="#a5b4fc" font-size="21" font-weight="600">INFRASTRUCTURE · VIRTUALIZATION · TELCO CLOUD</text><text x="74" y="336" fill="#94a3b8" font-size="16">Cloud-native systems  /  Kubernetes  /  Automation  /  Observability</text></g>
  <g transform="translate(74 380)"><rect width="563" height="104" rx="10" fill="#070b14" stroke="#334155" stroke-opacity=".85"/><circle cx="24" cy="23" r="4" fill="#22d3ee"/><circle cx="39" cy="23" r="4" fill="#64748b"/><circle cx="54" cy="23" r="4" fill="#64748b"/><text x="80" y="29" fill="#64748b" font-family="Consolas,'Courier New',monospace" font-size="12">engineering-profile / active</text><text x="25" y="66" fill="#67e8f9" font-family="Consolas,'Courier New',monospace" font-size="15">$ focus</text><text x="100" y="66" fill="#cbd5e1" font-family="Consolas,'Courier New',monospace" font-size="15">reproducible systems, delivery &amp; observability</text><text x="25" y="90" fill="#67e8f9" font-family="Consolas,'Courier New',monospace" font-size="15">$ status</text><text x="108" y="90" fill="#a5f3fc" font-family="Consolas,'Courier New',monospace" font-size="15">open to engineering opportunities</text><rect class="blink" x="384" y="79" width="9" height="16" fill="#22d3ee"/></g>
  <g transform="translate(810 66)"><text x="0" y="0" fill="#64748b" font-family="Consolas,'Courier New',monospace" font-size="12" letter-spacing="1.6">DISTRIBUTED SYSTEM / HEALTHY</text><path class="route" d="M55 210 C155 210 170 108 300 108 S410 190 520 190" fill="none" stroke="#38bdf8" stroke-opacity=".72" stroke-width="1.5"/><path class="route-slow" d="M55 210 C146 310 250 320 355 240 S453 168 520 190" fill="none" stroke="#a78bfa" stroke-opacity=".52" stroke-width="1.2"/><path class="route-slow" d="M300 108 C335 42 447 48 500 95" fill="none" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.2"/><path d="M55 210 C155 210 170 108 300 108 S410 190 520 190" fill="none" stroke="#0ea5e9" stroke-opacity=".17" stroke-width="6"/><g class="packet packet-a" transform="translate(55 210)"><circle r="5" fill="#e0f2fe"/><circle class="pulse" r="12" fill="none" stroke="#22d3ee" stroke-width="1.4"/></g><g class="packet packet-b" transform="translate(520 190)"><circle r="4.5" fill="#ddd6fe"/><circle class="pulse-late" r="12" fill="none" stroke="#a78bfa" stroke-width="1.4"/></g><g class="packet packet-c" transform="translate(520 190)"><circle r="4.5" fill="#e0f2fe"/></g>
    <g transform="translate(33 188)"><circle class="pulse" cx="22" cy="22" r="22" fill="#0e7490" fill-opacity=".14"/><rect x="3" y="4" width="38" height="36" rx="7" fill="#101c30" stroke="#22d3ee" stroke-opacity=".8"/><path d="M12 16h20M12 23h13M12 30h17" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/><text x="-4" y="64" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="12">INGEST</text></g>
    <g transform="translate(278 86)"><circle class="pulse-late" cx="22" cy="22" r="22" fill="#1d4ed8" fill-opacity=".15"/><rect x="3" y="4" width="38" height="36" rx="7" fill="#101c30" stroke="#60a5fa" stroke-opacity=".85"/><path d="M10 25c4-8 8-8 12 0 4-8 8-8 12 0" fill="none" stroke="#bae6fd" stroke-width="1.8" stroke-linecap="round"/><text x="-11" y="64" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="12">PROCESS</text></g>
    <g transform="translate(498 168)"><circle class="pulse" cx="22" cy="22" r="22" fill="#7c3aed" fill-opacity=".12"/><rect x="3" y="4" width="38" height="36" rx="7" fill="#101c30" stroke="#a78bfa" stroke-opacity=".86"/><path d="M12 31V19m8 12V13m8 18V22" stroke="#ddd6fe" stroke-width="2" stroke-linecap="round"/><text x="-14" y="64" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="12">OBSERVE</text></g>
    <g transform="translate(478 73)"><rect width="82" height="30" rx="15" fill="#0c1827" stroke="#334155"/><circle class="pulse" cx="17" cy="15" r="4" fill="#22c55e"/><text x="29" y="19" fill="#cbd5e1" font-family="Consolas,'Courier New',monospace" font-size="11">NOMINAL</text></g></g>
  <g fill="#64748b" font-family="Consolas,'Courier New',monospace" font-size="11"><text x="74" y="527">MOROCCO / UTC+1</text><text x="1165" y="527">SYSTEMS / PLATFORM / DELIVERY</text></g><path d="M74 504H1366" stroke="#334155" stroke-opacity=".58"/>
</svg>
